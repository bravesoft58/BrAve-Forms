# BrAve Forms - Docker Compose for Local Development
# Usage: docker compose up -d
# Then run: pnpm dev (apps connect to containerized services)

services:
  # PostgreSQL Database with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: braveforms-postgres
    environment:
      POSTGRES_DB: brave_forms
      POSTGRES_USER: brave
      POSTGRES_PASSWORD: brave_secure_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brave -d brave_forms']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - braveforms-network

  # Redis for BullMQ and caching
  redis:
    image: redis:7-alpine
    container_name: braveforms-redis
    command: redis-server --appendonly yes --requirepass redis_secure_pass
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_secure_pass', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - braveforms-network

  # SeaweedFS Object Storage for photos (S3-compatible)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: braveforms-seaweedfs
    command: server -s3 -dir=/data -filer
    ports:
      - '8335:8333' # S3 API (8333 taken by globe-corp, 8334 by engram-flow)
      - '9335:9333' # Master (9333 taken by globe-corp, 9334 by engram-flow)
      - '8081:8080' # Filer (8080 taken by globe-corp)
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9333/cluster/status']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - braveforms-network

  # Backend API (NestJS GraphQL)
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: braveforms-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://brave:brave_secure_pass@postgres:5432/brave_forms?schema=public
      REDIS_URL: redis://:redis_secure_pass@redis:6379
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET_NAME: brave-forms-uploads
      SKIP_CLERK_AUTH: 'false'
      CLERK_SECRET_KEY: sk_test_ukrcGObFIAn9XhIrhalKVKBSG90MqO8rPeRyXlIFjY
      CLERK_PUBLISHABLE_KEY: pk_test_c2VsZWN0ZWQtcHVtYS05OC5jbGVyay5hY2NvdW50cy5kZXYk
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - braveforms-network
    restart: unless-stopped

  # Frontend Web (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:4000/graphql
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VsZWN0ZWQtcHVtYS05OC5jbGVyay5hY2NvdW50cy5kZXYk
        NEXT_PUBLIC_SKIP_CLERK_AUTH: 'false'
        SKIP_CLERK_AUTH: 'false'
    container_name: braveforms-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:4000/graphql
      NEXT_PUBLIC_SKIP_CLERK_AUTH: 'false'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VsZWN0ZWQtcHVtYS05OC5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ukrcGObFIAn9XhIrhalKVKBSG90MqO8rPeRyXlIFjY
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - braveforms-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: braveforms-postgres-data
  redis_data:
    name: braveforms-redis-data
  seaweedfs_data:
    name: braveforms-seaweedfs-data

networks:
  braveforms-network:
    driver: bridge
    name: braveforms-network
