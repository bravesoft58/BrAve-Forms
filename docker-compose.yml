# BrAve Forms - Docker Compose for Local Development
# Usage: docker compose up -d
# Then run: pnpm dev (apps connect to containerized services)

services:
  # PostgreSQL Database with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: braveforms-postgres
    environment:
      POSTGRES_DB: brave_forms
      POSTGRES_USER: brave
      POSTGRES_PASSWORD: brave_secure_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brave -d brave_forms']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - braveforms-network

  # Redis for BullMQ and caching
  redis:
    image: redis:7-alpine
    container_name: braveforms-redis
    command: redis-server --appendonly yes --requirepass redis_secure_pass
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_secure_pass', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - braveforms-network

  # MinIO Object Storage for photos (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: braveforms-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - braveforms-network

  # Backend API (NestJS GraphQL)
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: braveforms-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://brave:brave_secure_pass@postgres:5432/brave_forms?schema=public
      REDIS_URL: redis://:redis_secure_pass@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: 'false'
      MINIO_BUCKET: brave-forms-uploads
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_NAME: brave-forms-uploads
      SKIP_CLERK_AUTH: 'true'
      CLERK_SECRET_KEY: sk_test_placeholder_for_local_dev
      CLERK_PUBLISHABLE_KEY: pk_test_placeholder_for_local_dev
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - braveforms-network
    restart: unless-stopped

  # Frontend Web (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: braveforms-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/graphql
      NEXT_PUBLIC_SKIP_CLERK_AUTH: 'true'
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - braveforms-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: braveforms-postgres-data
  redis_data:
    name: braveforms-redis-data
  minio_data:
    name: braveforms-minio-data

networks:
  braveforms-network:
    driver: bridge
    name: braveforms-network
