# BrAve Forms - Docker Compose for Local Development
# Usage: docker compose up -d
# Then run: pnpm dev (apps connect to containerized services)

services:
  # PostgreSQL Database with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: braveforms-postgres
    environment:
      POSTGRES_DB: brave_forms
      POSTGRES_USER: brave
      POSTGRES_PASSWORD: brave_secure_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brave -d brave_forms']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - braveforms-network

  # Redis for BullMQ and caching
  redis:
    image: redis:7-alpine
    container_name: braveforms-redis
    command: redis-server --appendonly yes --requirepass redis_secure_pass
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_secure_pass', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - braveforms-network

  # MinIO Object Storage for photos (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: braveforms-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - braveforms-network

volumes:
  postgres_data:
    name: braveforms-postgres-data
  redis_data:
    name: braveforms-redis-data
  minio_data:
    name: braveforms-minio-data

networks:
  braveforms-network:
    driver: bridge
    name: braveforms-network
