# Namespace for BrAve Forms local development
# Isolates all resources for better organization and multi-project support
# Using single-word 'braveforms' for easier CLI usage with Rancher Desktop
apiVersion: v1
kind: Namespace
metadata:
  name: braveforms
  labels:
    app: braveforms
    environment: local
    compliance: epa-cgp
    runtime: rancher-desktop
---
# Resource quota to prevent runaway resource consumption in local dev
apiVersion: v1
kind: ResourceQuota
metadata:
  name: braveforms-quota
  namespace: braveforms
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    services: "10"