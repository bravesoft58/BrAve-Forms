# SeaweedFS - Local S3-compatible storage for photo storage
# Stores construction site photos with GPS metadata
# NodePort 30103 for filer UI access
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-pvc
  namespace: braveforms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: braveforms
  labels:
    app: seaweedfs
    tier: storage
spec:
  type: ClusterIP
  ports:
    - port: 8333
      targetPort: 8333
      protocol: TCP
      name: s3
    - port: 9333
      targetPort: 9333
      protocol: TCP
      name: master
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: filer
  selector:
    app: seaweedfs
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
  namespace: braveforms
  labels:
    app: seaweedfs
    tier: storage
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30103
      protocol: TCP
  selector:
    app: seaweedfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: braveforms
  labels:
    app: seaweedfs
    tier: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
        tier: storage
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args:
            - server
            - -s3
            - -dir=/data
            - -filer
          ports:
            - containerPort: 8333
            - containerPort: 9333
            - containerPort: 8080
          volumeMounts:
            - name: seaweedfs-storage
              mountPath: /data
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:9333/cluster/status
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:9333/cluster/status
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: seaweedfs-storage
          persistentVolumeClaim:
            claimName: seaweedfs-pvc
