# BrAve Forms - Nginx Configuration for DigitalOcean
# Copy this file to /etc/nginx/sites-available/braveforms
# Then: sudo ln -s /etc/nginx/sites-available/braveforms /etc/nginx/sites-enabled/
#
# After copying, replace:
#   - YOUR_DOMAIN with your actual domain (e.g., braveforms.example.com)
#   - Or use your Droplet IP for testing without a domain
#
# SSL will be added automatically by certbot:
#   sudo certbot --nginx -d YOUR_DOMAIN -d api.YOUR_DOMAIN

# Rate limiting zone (prevent abuse)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=1r/s;

# Upstream definitions
upstream braveforms_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream braveforms_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Frontend - braveforms.YOUR_DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name braveforms.YOUR_DOMAIN;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    location / {
        proxy_pass http://braveforms_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Next.js static files
    location /_next/static {
        proxy_pass http://braveforms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# Backend API - api.braveforms.YOUR_DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name api.braveforms.YOUR_DOMAIN;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # GraphQL endpoint
    location /graphql {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://braveforms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Allow larger request bodies for GraphQL mutations with photos
        client_max_body_size 50M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # File upload endpoint (if separate)
    location /upload {
        # Stricter rate limiting for uploads
        limit_req zone=upload_limit burst=5 nodelay;

        proxy_pass http://braveforms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large file uploads for photos
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://braveforms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Default location
    location / {
        proxy_pass http://braveforms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Redirect www to non-www (optional)
server {
    listen 80;
    listen [::]:80;
    server_name www.braveforms.YOUR_DOMAIN;
    return 301 $scheme://braveforms.YOUR_DOMAIN$request_uri;
}
